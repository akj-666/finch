<!DOCTYPE html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finch — Expense Tracker</title>
    <meta name="description" content="Business expense and operational spend tracking for Finch. Kottayam, Kerala, India." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />

  <body class="bg-[#FFF8EE] text-[#1E2922] font-sans antialiased min-h-screen selection:bg-[#C89B3C]/30 selection:text-[#0F3B2E]">
    <div id="root">
      <!-- Instant mobile splash screen pre-render before React hydrates -->
      <div style="position:fixed;inset:0;background:linear-gradient(to bottom, #fffaf2, #fff8ee);display:flex;flex-direction:column;justify-content:space-between;align-items:center;z-index:9999;user-select:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);">
        <div style="width:100%;height:6px;background-color:#0f3b2e;"></div>
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;">
          <svg viewBox="310 800 460 410" style="width:144px;height:144px;filter:drop-shadow(0 18px 24px rgba(15,59,46,0.14));" role="img" aria-label="Finch bird mark">
            <circle cx="540" cy="1000" r="174" fill="#0f3b2e" />
            <circle cx="540" cy="1000" r="150" fill="none" stroke="#c89b3c" stroke-width="2.5" opacity="0.52" />
            <path d="M570 883c-77 0-137 57-137 137 0 61 33 108 86 130-14 20-33 37-61 49 47 12 96-1 130-34 75-6 129-63 129-139 0-80-63-143-147-143Z" fill="#fff8ee" />
            <path d="M476 1032c29-40 70-61 122-59-20 14-33 33-38 58 27-13 57-16 89-8-27 36-67 58-115 62-26-12-46-30-58-53Z" fill="#0f3b2e" />
            <circle cx="611" cy="966" r="11" fill="#c89b3c" />
            <path d="m684 968 69 22-69 22c7-14 7-30 0-44Z" fill="#c89b3c" />
            <path d="M401 1129c-28 8-50 25-65 49 33-5 62-18 85-41l-20-8Z" fill="#c89b3c" />
          </svg>
          <div style="font-family:'Plus Jakarta Sans',sans-serif;font-size:42px;font-weight:800;letter-spacing:-0.04em;color:#0f3b2e;text-transform:lowercase;line-height:1;margin-top:16px;">finch</div>
          <div style="font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;color:#63736a;letter-spacing:0.02em;margin-top:8px;font-weight:500;">A clearer view of every rupee.</div>
          <div style="margin-top:28px;display:flex;flex-direction:column;align-items:center;">
            <div style="width:180px;height:4px;border-radius:9999px;background-color:#e7e9df;overflow:hidden;">
              <div style="width:65%;height:100%;border-radius:9999px;background-color:#c89b3c;"></div>
            </div>
            <div style="font-family:'Plus Jakarta Sans',sans-serif;font-size:10px;text-transform:uppercase;letter-spacing:0.2em;font-weight:600;color:#88938c;margin-top:10px;">GETTING THINGS READY</div>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;padding-bottom:12px;width:100%;">
          <div style="font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;font-weight:600;color:#87928b;margin-bottom:12px;">KOTTAYAM · KERALA</div>
          <div style="width:100%;height:6px;background-color:#0f3b2e;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
